{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>{% block title %}Expense Splitter{% endblock %}</title>
    <link rel="stylesheet" href="{% static 'css/style.css' %}">
 
</head>

<body>

 <nav class="navbar">
    <div class="nav-container">

        <a href="{% url 'group_list' %}" class="logo">
            Expense Splitter
        </a>

        <div class="nav-links">

            {% if user.is_authenticated %}

                <a href="{% url 'group_list' %}">
                    Groups
                </a>

                <form method="post"
                      action="{% url 'logout' %}"
                      class="logout-form">

                    {% csrf_token %}

                    <button type="submit" class="logout-button">
                        Logout
                    </button>

                </form>

            {% else %}

                <a href="{% url 'login' %}">
                    Login
                </a>

                <a href="{% url 'register' %}">
                    Register
                </a>

            {% endif %}

        </div>

    </div>
</nav>

    <main class="container">
        <a href="{% url 'group_list' %}"
           class="back-button"
           onclick="if (window.history.length > 1) { window.history.back(); return false; }">
            &larr; Back
        </a>

        {% block content %}
        {% endblock %}
    </main>

</body>
</html>
