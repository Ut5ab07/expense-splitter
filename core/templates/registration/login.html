{% extends "base.html" %}

{% block title %}Login - Expense Splitter{% endblock %}

{% block content %}

<div class="auth-container">

    <div class="auth-card">

        <h1>Welcome back</h1>

        <p class="auth-subtitle">
            Login to manage your groups and expenses.
        </p>

        <form method="post">

            {% csrf_token %}

            {{ form.as_p }}

            <button type="submit" class="button">
                Login
            </button>

        </form>

        <div class="auth-footer">
            Don't have an account?
            <a href="{% url 'register' %}">Create one</a>
        </div>

    </div>

</div>

{% endblock %}
